name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_KEY: ${{ vars.API_KEY }}
      NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Wake up API
        run: |
          curl --retry 5 --retry-delay 30 \
            -X POST "${NEXT_PUBLIC_API_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ vars.API_KEY }}" \
            -d '{"query":"{ __typename }"}' \
            -s -o /dev/null || exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build

      - name: Run tests
        run: npm run test

